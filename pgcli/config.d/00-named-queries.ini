[named queries]
slots = "SELECT slot_name, active_pid, active, wal_status, restart_lsn, confirmed_flush_lsn, pg_current_wal_lsn(), pg_size_pretty((pg_current_wal_lsn() - confirmed_flush_lsn)) AS subscriber_lag, pg_size_pretty((pg_current_wal_lsn() - restart_lsn)) as restart_lag FROM pg_replication_slots"
slots_short = "SELECT slot_name, active_pid, active, wal_status,  pg_size_pretty((pg_current_wal_lsn() - confirmed_flush_lsn)) AS subscriber_lag FROM pg_replication_slots"
pubs = "SELECT pt.pubname, r.rolname AS owner, p.pubviaroot, array_agg(pt.schemaname || '.' || pt.tablename) AS tables FROM pg_publication_tables pt JOIN pg_publication p on pt.pubname = p.pubname JOIN pg_roles r ON r.oid = p.pubowner GROUP BY pt.pubname, p.pubviaroot, r.rolname"
pubs_more = "SELECT pt.pubname, r.rolname AS owner, p.pubviaroot, pt.schemaname, pt.tablename, substring(text(attnames),1,40) || '...' as attnames, pt.rowfilter from pg_publication_tables pt JOIN pg_publication p on pt.pubname = p.pubname JOIN pg_roles r ON r.oid = p.pubowner"
pubs_expanded = "SELECT pt.pubname, r.rolname AS owner, p.pubviaroot, pt.schemaname, pt.tablename, pt.attnames, pt.rowfilter from pg_publication_tables pt JOIN pg_publication p on pt.pubname = p.pubname JOIN pg_roles r ON r.oid = p.pubowner"
subs = "SELECT pgs.subname, pgs.subenabled, substring(REGEXP_REPLACE(pgs.subconninfo, 'password=[\S]+', 'password=XXX'), 1, 20) || '...' as subconninfo, pgs.subslotname, pgs.subpublications, pgss.last_msg_receipt_time from pg_subscription pgs join pg_stat_subscription pgss on pgss.subname = pgs.subname"
long_running_prepared_xacts = "SELECT transaction, gid, prepared, age(now(), prepared) AS transaction_duration, owner, database FROM pg_catalog.pg_prepared_xacts WHERE now() - prepared > interval '10 minutes' ORDER BY prepared"
idle_xacts = "SELECT * FROM pg_stat_activity WHERE state = 'idle in transaction'"
